name: Build PonWrt with gecoosac for ZN504XG-D

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Checkout PonWrt source
        uses: actions/checkout@v4
        with:
          repository: pbs05/ponwrt
          ref: master
          fetch-depth: 1

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3-distutils rsync unzip zlib1g-dev file wget python3-pip

      - name: Clone gecoosac package
        run: |
          git clone https://github.com/openwrt-fork/openwrt-gecoosac package/openwrt-gecoosac

      - name: Update and install feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure target (airoha/an7581 + znxt_zn504xg-d + gecoosac)
        run: |
          cat > .config << 'EOF'
          CONFIG_TARGET_airoha=y
          CONFIG_TARGET_airoha_an7581=y
          CONFIG_TARGET_airoha_an7581_DEVICE_znxt_zn504xg-d=y
          CONFIG_PACKAGE_luci-app-gecoosac=y
          CONFIG_PACKAGE_luci-i18n-gecoosac-zh-cn=y
          CONFIG_PACKAGE_luci-lua-runtime=y
          CONFIG_USE_APK=y
          EOF
          make defconfig

      - name: Download packages
        run: |
          make download -j$(nproc) V=s

      - name: Build firmware
        run: |
          make -j$(nproc) V=s

      - name: Collect firmware
        run: |
          mkdir -p artifact
          find bin/targets/airoha/an7581/ -name "*sysupgrade.itb" -exec cp {} artifact/ \;
          find bin/targets/airoha/an7581/ -name "*initramfs*" -exec cp {} artifact/ \;
          ls -la artifact/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ponwrt-gecoosac-zn504xgd
          path: artifact/
          retention-days: 30
